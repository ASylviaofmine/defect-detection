<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 1280px; height: 720px; }
  body {
    width: 1280px; height: 720px;
    position: relative; overflow: hidden;
    background: #0e1319;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  /* ---- 左侧：真实验证集预测拼图，完整入镜 ---- */
  .photo {
    position: absolute; left: 0; top: 0;
    width: 740px; height: 720px;
    display: flex; align-items: center; justify-content: center;
    background: #0a0e13;
  }
  .photo img {
    width: 690px; height: 568px;
    object-fit: contain;
    border: 1px solid #3a4652;
  }
  .photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(14,19,25,0) 0%,
      rgba(14,19,25,0.45) 80%,
      rgba(14,19,25,0.96) 97%,
      #0e1319 100%);
  }
  /* ---- 右侧：标题区 ---- */
  .text {
    position: absolute; left: 730px; top: 0;
    width: 550px; height: 720px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 56px 0 30px;
  }
  .kicker {
    color: #8fa3b8; font-size: 21px; letter-spacing: 6px;
    text-transform: uppercase; margin-bottom: 26px; font-weight: 600;
  }
  h1 {
    color: #f4f7fa; font-size: 58px; line-height: 1.12;
    font-weight: 800; letter-spacing: 1px;
  }
  h1 .hl {
    color: #ffb238;
  }
  .rule {
    width: 96px; height: 5px; background: #ffb238;
    border-radius: 3px; margin: 30px 0 26px;
  }
  .meta {
    color: #cfd9e2; font-size: 27px; font-weight: 600; line-height: 1.5;
  }
  .meta .num { color: #6fd68f; font-weight: 800; }
  .foot {
    margin-top: 34px; color: #6d7f92; font-size: 19px; font-weight: 500;
  }
</style>
</head>
<body>
  <div class="photo"><img src="six_classes.png" alt=""></div>
  <div class="text">
    <div class="kicker">Project Walkthrough</div>
    <h1>Steel Surface<br><span class="hl">Defect Detection</span></h1>
    <div class="rule"></div>
    <div class="meta">YOLOv8 &middot; NEU-DET<br>mAP@50 <span class="num">0.766</span></div>
    <div class="foot">github.com/ASylviaofmine/defect-detection</div>
  </div>
</body>
</html>
